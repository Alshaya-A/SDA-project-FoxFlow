<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">FoxFlow presentation architecture</title>
  <desc id="desc">A clear presentation diagram showing GitLab as the primary platform, automated DevSecOps stages, Azure deployment, dashboard, AI analysis, Telegram notifications, monitoring, and backup. GitHub is used only as a code archive.</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#071a33"/><stop offset="1" stop-color="#143c68"/></linearGradient>
    <linearGradient id="ci" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#071a33" flood-opacity=".13"/></filter>
    <marker id="darkArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#173654"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#2878bd"/></marker>
    <marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#7556c5"/></marker>
    <style>
      .title{font:800 37px Inter,Arial,sans-serif;fill:#fff;letter-spacing:.5px}
      .section{font:800 25px Inter,Arial,sans-serif;fill:#10233f}
      .label{font:800 23px Inter,Arial,sans-serif;fill:#10233f}
      .body{font:600 18px Inter,Arial,sans-serif;fill:#50657d}
      .small{font:700 15px Inter,Arial,sans-serif;fill:#60758d}
      .card{fill:#fff;stroke:#a7b7c8;stroke-width:2.2;rx:15;filter:url(#shadow)}
      .flow{fill:none;stroke:#173654;stroke-width:3.2;marker-end:url(#darkArrow)}
      .deploy{fill:none;stroke:#2878bd;stroke-width:3.4;marker-end:url(#blueArrow)}
      .ops{fill:none;stroke:#7556c5;stroke-width:2.7;stroke-dasharray:8 7;marker-end:url(#purpleArrow)}
      .icon{fill:none;stroke:#173654;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f5f8fc"/>
  <rect width="1920" height="120" fill="url(#head)"/>
  <g transform="translate(45 14)">
    <rect x="13" width="70" height="18" rx="4" fill="#2c5078"/><circle cx="25" cy="9" r="3.5" fill="#66f0b5"/><circle cx="39" cy="9" r="3.5" fill="#ffd166"/>
    <path d="M7 32L27 21l22 10 22-10 20 11-7 42-35 22L14 74z" fill="#ff6b35" stroke="#dbeaff" stroke-width="3.5"/><path d="M23 46l16 8 10-11 9 11 17-8-8 26-18 12-18-12z" fill="#fff2df"/><circle cx="35" cy="58" r="3.5" fill="#173654"/><circle cx="62" cy="58" r="3.5" fill="#173654"/><path d="M45 68h8l-4 6z" fill="#173654"/>
    <text x="115" y="48" class="title">FOXFLOW — SECURE DELIVERY FLOW</text>
    <text x="117" y="79" font-family="Inter,Arial" font-size="18" font-weight="500" fill="#c6ddf5">GitLab is the primary workspace · GitHub stores an archive copy</text>
  </g>
  <g transform="translate(1510 36)"><rect width="170" height="42" rx="21" fill="#123f56" stroke="#66f0b5" stroke-width="1.5"/><circle cx="23" cy="21" r="7" fill="#66f0b5"/><text x="95" y="27" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="800" fill="#e6fff5">AUTOMATED</text><rect x="185" width="155" height="42" rx="21" fill="#183a63" stroke="#78b7ff" stroke-width="1.5"/><text x="262" y="27" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="800" fill="#e6f2ff">HTTPS</text></g>

