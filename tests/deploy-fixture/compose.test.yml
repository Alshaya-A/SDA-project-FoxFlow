services:
  app:
    command: ["node", "/fixture/server.js"]
    volumes:
      - "${FIXTURE_DIR:?FIXTURE_DIR is required}:/fixture:ro"
    environment:
      HEALTH_MODE: ${HEALTH_MODE:-healthy}
    # Preserve the production probe; shorten timings for deliberate failures.
    healthcheck:
      interval: 1s
      timeout: 2s
      retries: 2
      start_period: 1s
