# Initial design: requires the application and Runner prerequisites in docs/ci-cd.md.
stages: [build, test, security_scan, deploy, notify]

default:
  tags: [foxflow]

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

build:
  stage: build
  image: docker:29.7.2-cli
  services:
    - name: docker:29.7.2-dind
      alias: docker
      command: ["--insecure-registry=10.0.1.4:5050"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  script:
    - docker info
    - test -f package-lock.json
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"

test:
  stage: test
  image: node:24-alpine
  script:
    - npm ci
    - npm test

failure_demo:
  stage: test
  image: alpine:3.22
  rules:
    - if: '$FAILURE_DEMO == "true"'
    - when: never
  script:
    - |
      printf '%s\n' 'Health check failed: expected HTTP 200 but received HTTP 500 at /health.' | tee failure-context.txt
    - exit 1
  artifacts:
    when: always
    paths: [failure-context.txt]
    expire_in: 1 day

security_scan:
  stage: security_scan
  image:
    name: aquasec/trivy:0.69.3
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --image-src remote --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE_TAG"

deploy:
  stage: deploy
  image: docker:29.7.2-cli
  resource_group: production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $DEPLOY_ENABLED == "true"'
    - when: never
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh ci/deploy.sh

.telegram_notify:
  stage: notify
  image: node:24-alpine
  allow_failure: true
  script:
    - node ci/notify.mjs
  artifacts:
    when: always
    paths: [pipeline-summary.txt]
    expire_in: 7 days

notify_success:
  extends: .telegram_notify
  when: on_success
  variables:
    PIPELINE_RESULT: "success"

notify_failure:
  extends: .telegram_notify
  when: on_failure
  variables:
    PIPELINE_RESULT: "failure"
