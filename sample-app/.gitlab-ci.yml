# Initial design: requires the application and Runner prerequisites in docs/ci-cd.md.
stages: [build, test, security_scan, deploy, notify]

default:
  tags: [foxflow]

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

build:
  stage: build
  image: docker:29.7.2-cli
  services:
    - name: docker:29.7.2-dind
      alias: docker
      command: ["--insecure-registry=10.0.1.4:5050"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  script:
    - docker info
    - test -f package-lock.json
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"

test:
  stage: test
  image: node:24-alpine
  script:
    - npm ci
    - npm test

security_scan:
  stage: security_scan
  image:
    name: aquasec/trivy:0.69.3
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --image-src remote --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE_TAG"

deploy:
  stage: deploy
  image: docker:29.7.2-cli
  resource_group: production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $DEPLOY_ENABLED == "true"'
    - when: never
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh ci/deploy.sh

.telegram_notify:
  stage: notify
  image:
    name: curlimages/curl:8.17.0
    entrypoint: [""]
  allow_failure: true
  script:
    - |
      test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo 'TELEGRAM_BOT_TOKEN is not configured'; exit 1; }
      test -n "${TELEGRAM_CHAT_ID:-}" || { echo 'TELEGRAM_CHAT_ID is not configured'; exit 1; }
      MESSAGE="${TELEGRAM_ICON} FoxFlow Pipeline ${TELEGRAM_RESULT}
      Project: ${CI_PROJECT_PATH}
      Branch: ${CI_COMMIT_REF_NAME}
      Commit: ${CI_COMMIT_SHORT_SHA}
      Pipeline: ${CI_PIPELINE_URL}"
      printf '%s\n' "$MESSAGE" > pipeline-summary.txt
      cat pipeline-summary.txt
      curl --fail --silent --show-error \
        --request POST \
        "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=${MESSAGE}" \
        >/dev/null
  artifacts:
    when: always
    paths: [pipeline-summary.txt]
    expire_in: 7 days

notify_success:
  extends: .telegram_notify
  when: on_success
  variables:
    TELEGRAM_ICON: "✅"
    TELEGRAM_RESULT: "succeeded"

notify_failure:
  extends: .telegram_notify
  when: on_failure
  variables:
    TELEGRAM_ICON: "🚨"
    TELEGRAM_RESULT: "failed"
