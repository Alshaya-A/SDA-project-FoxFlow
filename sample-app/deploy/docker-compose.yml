services:
  app:
    image: ${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      GITLAB_API_URL: "${CI_API_V4_URL:?CI_API_V4_URL is required}"
      GITLAB_PROJECT_ID: "${CI_PROJECT_ID:?CI_PROJECT_ID is required}"
      GITLAB_API_TOKEN: "${GITLAB_API_TOKEN:?GITLAB_API_TOKEN is required}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(async r=>{const b=await r.json();if(r.status!==200||b.status!=='ok'||b.service!=='foxflow-sample')throw Error('health')}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
